<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Course | Admin</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #eef2f7;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            background: #ffffff;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h3 {
            font-weight: 700;
            color: #333;
        }

        .form-control, .form-select {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #d7dce5;
            transition: 0.25s;
        }

        .form-control:focus, .form-select:focus {
            border-color: #4a6cf7;
            box-shadow: 0 0 6px rgba(74, 108, 247, 0.3);
        }

        .btn-primary {
            padding: 12px 18px;
            background: #4a6cf7;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.25s;
        }

        .btn-primary:hover {
            background: #3857d5;
        }

        .btn-secondary {
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 600;
            background: #d0d5dd;
            border: none;
            transition: 0.25s;
        }

        .btn-secondary:hover {
            background: #babfc7;
        }

    </style>
</head>

<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card">
                <h3 class="text-center mb-4">✏️ Edit Course</h3>

                <!-- Edit Course Form -->
                <form th:action="@{'/admin/courses/update/' + ${course.id}}" th:object="${course}" method="post">

                    <input type="hidden" th:field="*{id}"/>

                    <!-- Title -->
                    <div class="mb-3">
                        <label class="form-label">Course Title</label>
                        <input type="text" th:field="*{title}" class="form-control"
                               placeholder="Enter course title" required>
                    </div>

                    <!-- Category -->
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <input type="text" th:field="*{category}" class="form-control"
                               placeholder="e.g., Programming, Science">
                    </div>

                    <!-- Duration -->
                    <div class="mb-3">
                        <label class="form-label">Duration</label>
                        <input type="text" th:field="*{duration}" class="form-control"
                               placeholder="e.g., 6 Weeks, 10 Hours">
                    </div>

                    <!-- Level -->
                    <div class="mb-3">
                        <label class="form-label">Level</label>
                        <select th:field="*{level}" class="form-select">
                            <option value="Beginner">Beginner</option>
                            <option value="Intermediate">Intermediate</option>
                            <option value="Advanced">Advanced</option>
                        </select>
                    </div>

                    <!-- Price -->
                    <div class="mb-3">
                        <label class="form-label">Price (INR)</label>
                        <input type="text" th:field="*{price}" class="form-control"
                               placeholder="e.g., 499, 999">
                    </div>

                    <!-- Thumbnail URL -->
                    <div class="mb-3">
                        <label class="form-label">Thumbnail URL</label>
                        <input type="text" th:field="*{thumb}" class="form-control"
                               placeholder="Paste course image link">
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex justify-content-between mt-4">
                        <a href="/admin/courses" class="btn btn-secondary">⬅ Back</a>
                        <button type="submit" class="btn btn-primary">Update Course ✔</button>
                    </div>

                </form>
                <!-- End form -->

            </div>

        </div>
    </div>
</div>

</body>
</html>
