<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login - EduExam</title>

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: url('https://images.unsplash.com/photo-1612832021082-cdfb5a2f05e2?auto=format&fit=crop&w=1950&q=80')
                    no-repeat center center/cover;
    }

    .glass-card {
        width: 350px;
        padding: 30px 25px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.25);
        box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        text-align: center;
    }

    .glass-card h2 {
        margin-bottom: 25px;
        font-size: 28px;
        color: black;
    }

    .glass-card input {
        width: 90%;
        padding: 12px;
        margin: 12px 0;
        border-radius: 10px;
        border: 1px solid rgba(0,0,0,0.3);
        outline: none;
        background: rgba(255, 255, 255, 0.7);
        font-size: 14px;
    }

    .glass-card button {
        width: 95%;
        padding: 12px;
        margin-top: 15px;
        border: none;
        border-radius: 10px;
        background: green;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    .glass-card button:hover {
        background: darkgreen;
    }

    .glass-card a {
        display: block;
        margin-top: 12px;
        color: black;
        text-decoration: none;
        font-size: 13px;
    }

    .message {
        font-size: 14px;
        margin: 8px 0;
    }

    .error { color: red; }
    .success { color: green; }
</style>
</head>

<body>

<div class="glass-card">
    <h2>Login</h2>

    <!-- ✅ FIXED LOGIN FORM -->
    <form th:action="@{/login}" method="post">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <!-- Spring Security Error -->
    <p th:if="${param.error}" class="message error">
        Invalid email or password!
    </p>

    <!-- Logout message -->
    <p th:if="${param.logout}" class="message success">
        You have been logged out successfully.
    </p>

    <!-- Flash messages -->
    <p th:if="${success}" class="message success" th:text="${success}"></p>
    <p th:if="${error}" class="message error" th:text="${error}"></p>

    <a th:href="@{/forgot}">Forgot Password?</a>
    <a th:href="@{/register}">Register</a>
</div>

</body>
</html>
