<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Register - EduExam</title>
<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        /* Background image */
        background: url('https://images.unsplash.com/photo-1612832021082-cdfb5a2f05e2?auto=format&fit=crop&w=1950&q=80') no-repeat center center/cover;
    }

    .glass-card {
        width: 360px;
        padding: 30px 25px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.25);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        text-align: center;
        color: black; /* Text color black */
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .glass-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 40px rgba(31, 38, 135, 0.5);
    }

    .glass-card h2 {
        margin-bottom: 25px;
        font-size: 28px;
        color: black;
    }

    .glass-card input {
        width: 90%;
        padding: 12px;
        margin: 12px 0;
        border-radius: 10px;
        border: 1px solid rgba(0,0,0,0.3);
        outline: none;
        background: rgba(255, 255, 255, 0.7);
        color: black;
        font-size: 14px;
        transition: background 0.3s ease, border 0.3s ease;
    }

    .glass-card input:focus {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid #000000aa;
    }

    .glass-card button {
        width: 95%;
        padding: 12px;
        margin-top: 15px;
        border: none;
        border-radius: 10px;
        background: green; /* Register button green */
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s ease;
    }

    .glass-card button:hover {
        background: darkgreen;
    }

    .glass-card a {
        display: block;
        margin-top: 12px;
        color: black; /* Links black */
        text-decoration: none;
        font-size: 13px;
        transition: color 0.3s ease;
    }

    .glass-card a:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>
<div class="glass-card">
    <h2>Create Account</h2>
    <form th:action="@{/register}" method="post" th:object="${user}">
        <input type="text" th:field="*{name}" placeholder="Full Name" required>
        <input type="email" th:field="*{email}" placeholder="Email" required>
        <input type="password" th:field="*{password}" placeholder="Password" required>
        <input type="password" placeholder="Confirm Password" required>
        <button type="submit">Register</button>
    </form>
    <a th:href="@{/login}">Already have an account? Login</a>
</div>
</body>
</html>
