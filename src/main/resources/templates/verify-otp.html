<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Verify OTP</title>

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg,#4caf50,#81c784);
        font-family: Arial, sans-serif;
    }

    .box {
        background: white;
        padding: 25px;
        width: 340px;
        border-radius: 15px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.2);
        text-align: center;
    }

    input {
        width: 90%;
        padding: 10px;
        margin-top: 10px;
        border-radius: 8px;
        border: 1px solid #888;
        text-align: center;
        font-size: 20px;
        letter-spacing: 6px;
    }

    button {
        width: 95%;
        padding: 10px;
        margin-top: 15px;
        border: none;
        color: white;
        background: #007bff;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
    }

    button:hover {
        background: #0056b3;
    }

    .error {
        color: red;
        margin-top: 10px;
        font-size: 14px;
    }

    .success {
        color: green;
        margin-top: 10px;
        font-size: 14px;
    }

    .resend {
        margin-top: 15px;
        font-size: 14px;
    }

    .resend a {
        color: #007bff;
        text-decoration: none;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="box">
    <h2>OTP Verification</h2>

    <!-- ERROR / SUCCESS MESSAGE -->
    <p th:if="${error}" th:text="${error}" class="error"></p>
    <p th:if="${success}" th:text="${success}" class="success"></p>

    <form th:action="@{/verify-otp}" method="post">
        <input type="hidden" name="email" th:value="${email}">
        <input type="text"
               name="otp"
               maxlength="6"
               placeholder="Enter OTP"
               required
               autofocus>

        <button type="submit">Verify OTP</button>
    </form>

    <!-- RESEND OTP -->
    <div class="resend">
        Didn’t receive OTP?
        <a th:href="@{/resend-otp(email=${email})}">Resend</a>
    </div>
</div>

</body>
</html>
